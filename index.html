<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI通用能力测评</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal-50:#f0fdfa;--teal-100:#ccfbf1;--teal-200:#99f6e4;--teal-600:#0d9488;--teal-700:#0f766e;--teal-800:#115e59;
  --stone-50:#fafaf9;--stone-100:#f5f5f4;--stone-200:#e7e5e4;--stone-300:#d6d3d1;--stone-400:#a8a29e;--stone-500:#78716c;--stone-700:#44403c;--stone-800:#292524;--stone-900:#1c1917;
  --amber-50:#fffbeb;--amber-200:#fde68a;--amber-700:#b45309;--amber-800:#92400e;
  --red-50:#fef2f2;--red-200:#fecaca;--red-600:#dc2626;--red-700:#b91c1c;
  --blue-600:#2563eb;--purple-600:#7c3aed;--rose-600:#be123c;
}
html{-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
body{background:var(--stone-100);color:var(--stone-800);min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none}
.hidden{display:none!important}

/* ===== Layout ===== */
.app{max-width:672px;margin:0 auto;padding:16px}
@media(min-width:640px){.app{padding:24px}}

/* ===== Start Screen ===== */
.start-card{background:#fff;border:1px solid var(--stone-200);border-radius:16px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@media(min-width:640px){.start-card{padding:40px}}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-50);border:1px solid var(--teal-200);color:var(--teal-700);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:12px}
.start-card h1{font-size:28px;font-weight:700;color:var(--stone-900);letter-spacing:-.02em}
.start-card .subtitle{margin-top:12px;font-size:14px;line-height:1.6;color:var(--stone-500)}
.dim-list{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.dim-item{display:flex;align-items:flex-start;gap:12px;background:var(--stone-50);border:1px solid var(--stone-200);border-radius:12px;padding:12px 16px}
.dim-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px}
.dim-name{font-size:14px;font-weight:600;color:var(--stone-800)}
.dim-desc{font-size:12px;color:var(--stone-500)}
.input-group{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.input-row{display:flex;gap:12px}
.input-field{flex:1}
.input-field label{display:block;font-size:12px;font-weight:600;color:var(--stone-700);margin-bottom:4px}
.input-field input{width:100%;padding:10px 14px;border:1px solid var(--stone-300);border-radius:8px;font-size:14px;color:var(--stone-800);background:#fff;outline:none;transition:border-color .15s}
.input-field input:focus{border-color:var(--teal-600)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;width:100%;background:var(--teal-700);color:#fff;padding:12px 24px;border-radius:8px;font-size:16px;font-weight:600;transition:background .15s;margin-top:32px}
.btn-primary:hover{background:var(--teal-800)}
.btn-primary:active{background:var(--teal-800)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:#fff;border:1px solid var(--stone-300);color:var(--stone-700);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;transition:background .15s}
.btn-secondary:hover{background:var(--stone-50)}
.btn-secondary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{color:var(--stone-500);font-size:13px;padding:6px 12px;border-radius:6px;transition:background .15s}
.btn-ghost:hover{background:var(--stone-100)}

/* ===== Quiz Screen ===== */
.quiz-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}
.quiz-title{font-size:14px;font-weight:600;color:var(--stone-900)}
.quiz-progress-text{font-size:12px;color:var(--stone-500)}
.progress-bar{height:6px;width:100%;background:var(--stone-200);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--teal-600);border-radius:999px;transition:width .3s}
.quiz-card{margin-top:24px;background:#fff;border:1px solid var(--stone-200);border-radius:16px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.06);flex:1}
@media(min-width:640px){.quiz-card{padding:32px}}
.dim-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:16px}
.quiz-card h2{font-size:20px;font-weight:600;line-height:1.5;color:var(--stone-900)}
@media(min-width:640px){.quiz-card h2{font-size:22px;line-height:1.6}}
.options{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.option-btn{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--stone-200);border-radius:12px;font-size:14px;line-height:1.6;color:var(--stone-700);background:#fff;transition:all .15s}
.option-btn:hover{border-color:var(--teal-200);background:var(--teal-50)}
.option-btn.selected{border-color:var(--teal-600);background:var(--teal-50);color:var(--stone-900);box-shadow:0 0 0 1px var(--teal-600)}
.option-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--stone-300);border-radius:6px;font-size:12px;font-weight:700;color:var(--stone-500);flex-shrink:0;margin-top:2px;transition:all .15s}
.option-btn.selected .option-letter{border-color:var(--teal-600);background:var(--teal-600);color:#fff}
.quiz-nav{margin-top:20px;display:flex;align-items:center;justify-content:space-between}
.nav-hint{font-size:12px;color:var(--stone-400)}

/* ===== Result Screen ===== */
.result-card{background:#fff;border:1px solid var(--stone-200);border-radius:16px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@media(min-width:640px){.result-card{padding:36px}}
.result-header{display:flex;flex-direction:column;gap:24px}
@media(min-width:640px){.result-header{flex-direction:row;align-items:center;justify-content:space-between}}
.score-block .score-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--stone-400)}
.score-block .score-value{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.score-num{font-size:48px;font-weight:700;line-height:1;color:var(--stone-900)}
.score-max{font-size:14px;color:var(--stone-400);padding-bottom:4px}
.grade-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;margin-top:12px}
.grade-good{background:var(--teal-50);color:var(--teal-700);border:1px solid var(--teal-200)}
.grade-mid{background:var(--amber-50);color:var(--amber-700);border:1px solid var(--amber-200)}
.grade-low{background:var(--red-50);color:var(--red-700);border:1px solid var(--red-200)}
.advice{margin-top:12px;max-width:280px;font-size:14px;line-height:1.6;color:var(--stone-500)}
.radar-wrap{width:100%;max-width:288px;flex-shrink:0}

/* ===== Weakness & Wrong Questions ===== */
.weak-box{margin-top:32px;background:var(--amber-50);border:1px solid var(--amber-200);border-radius:12px;padding:16px}
.weak-title{font-size:14px;font-weight:600;color:var(--amber-800)}
.weak-tip{margin-top:4px;font-size:14px;line-height:1.6;color:var(--amber-700)}
.perfect-box{margin-top:32px;background:var(--teal-50);border:1px solid var(--teal-200);border-radius:12px;padding:16px;font-size:14px;font-weight:600;color:var(--teal-800);text-align:center}
.wrong-section{margin-top:32px}
.wrong-section h3{font-size:14px;font-weight:600;color:var(--stone-900)}
.wrong-list{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.wrong-item{background:var(--stone-50);border:1px solid var(--stone-200);border-radius:12px;padding:16px}
.wrong-item-meta{font-size:12px;font-weight:500;color:var(--stone-400)}
.wrong-item-q{margin-top:4px;font-size:14px;font-weight:500;color:var(--stone-800)}
.wrong-item-ans{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wrong-your{color:var(--red-600)}
.wrong-correct{color:var(--teal-700)}

/* ===== History ===== */
.history-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:#fff;border:1px solid var(--stone-200);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s}
.history-item:hover{border-color:var(--teal-200)}
.history-info{display:flex;flex-direction:column;gap:2px}
.history-name{font-size:14px;font-weight:600;color:var(--stone-800)}
.history-meta{font-size:12px;color:var(--stone-500)}
.history-score{display:flex;align-items:center;gap:8px}
.history-score-num{font-size:24px;font-weight:700;color:var(--stone-900)}
.history-score-grade{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.empty-state{text-align:center;padding:48px 24px;color:var(--stone-400);font-size:14px}

/* ===== Export Bar ===== */
.export-bar{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--stone-900);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:1000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Auto-save indicator ===== */
.autosave{font-size:11px;color:var(--stone-400);display:flex;align-items:center;gap:4px}
.autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--teal-600);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
// ===== Config =====
// 部署 Google Apps Script 后，将获得的 Web App URL 替换下面的占位符
// 部署步骤见同目录下的 google-apps-script.js 文件头部说明
const CONFIG = {
  SHEET_WEB_APP_URL: "" // <-- 替换为你的 Google Apps Script Web App URL
};

// ===== Data =====
const dimensions = [
  {name:"需求表达与提问能力",short:"需求表达",desc:"把需求说清楚，让 AI 一次听懂",tip:"把目标、结构、格式和约束一次说清，多用「按……输出、突出……」句式。",color:"#0f766e"},
  {name:"工具选型与AI认知",short:"工具选型",desc:"分清聊天 AI 与 Agent，按任务选对",tip:"分清「聊天问答」和「能调用工具、交付文件的 Agent」，按任务选择。",color:"#2563eb"},
  {name:"流程搭建与复用",short:"流程复用",desc:"把重复任务固化成流程，一次搭建多次复用",tip:"把重复任务沉淀成固定模板 / Skill，一次搭建、多次复用。",color:"#d97706"},
  {name:"资料整合与知识库",short:"资料整合",desc:"处理多格式资料，构建可检索知识库",tip:"先统一格式、建立索引，让员工提问能检索到原文并注明来源。",color:"#7c3aed"},
  {name:"输出核验与风险防控",short:"风险防控",desc:"核查事实、人工确认、防范幻觉",tip:"对数字、事实和来源保持核验，重要输出先人工确认再使用。",color:"#be123c"}
];

const questions = [
  {id:1,dim:0,text:"你刚开完一场 90 分钟的项目例会，语音转写稿有 8000 字，需要 15 分钟内把会议结论发到项目群。下面哪种问法最可能让 AI 一次给出能直接用的结果？",options:["让 AI 先以「会议纪要专家」角色通读全文，自行判断哪些内容重要，再整理成纪要要点","结合会议背景，按「结论、决策、待办、风险」结构输出，标注负责人与截止时间","让 AI 先把转写稿按议题整理成大纲，再逐步补充结论和待办，最后自己核对","让 AI 把转写稿整理成带发言人标注的逐字稿发到群里，方便大家回看原话"],answer:1,points:[3,5,2,0]},
  {id:2,dim:0,text:"你给 AI 一份含 12 个月、40 个区域、带有异常值和缺口的销售明细表，想知道「哪个区域表现最好」。下面哪种问法最合适？",options:["让 AI 按销售额给 40 个区域排出名次，第一名即代表整体表现最好","让 AI 把 40 个区域的同比、环比、毛利率全部分析一遍，出一份完整报告","先说明「销售额」口径，再让 AI 按该口径汇总出 Top3，并标注数据缺口","先让 AI 把数据转成对比图表，再综合分析图表的走势与分布，判断哪个区域最好"],answer:2,points:[2,3,5,1]},
  {id:3,dim:0,text:"AI 第一次给你的结果完全不是想要的方向，修改提示词后第二次仍不对。下一步最应该做什么？",options:["换用推理能力更强的模型再试一次，让它自己纠正之前的偏差","让 AI 一次生成 5 个不同方向的版本，从中选最接近的再继续优化","把两次结果和你的期望发给同事，请同事帮你改写提示词","举个你期望的输出示例，并明确指出第二次结果与期望的差距"],answer:3,points:[0,1,3,5]},
  {id:4,dim:0,text:"你要给 200 名新员工写一封「入职欢迎＋下周培训安排」的通知邮件，希望语气和格式一次到位。下面哪种做法最稳妥？",options:["说明收件人、目的、正式语气，500字内分三段，附往期通知作样例","找一封去年的类似通知，让 AI 照着风格和结构改写成今年的内容","让 AI 先写一版，你再逐段提修改意见，逐步调整到位","让 AI 参照网上的标准通知模板来写，措辞专业、直接可用"],answer:0,points:[5,3,2,0]},
  {id:5,dim:1,text:"下面哪个场景最能体现「AI Agent」区别于「聊天 AI」的价值？",options:["根据你的问题实时联网搜索，汇总最新信息来回答","记住你上周提过的偏好，下次写文案时自动沿用","根据你的历史对话，主动预测你可能要问的问题并提前准备答案","给一个目标，它能拆解多步、调用工具，处理完文件后把成品交给你"],answer:3,points:[0,1,2,5]},
  {id:6,dim:1,text:"你每周一要把 5 份格式略有不同的部门 Excel 汇总成一张周报并生成 PDF 发给大家。下面哪种方式最靠谱？",options:["先统一口径，再让 AI Agent 生成周报 PDF，人工检查后发送","把 5 份 Excel 一次性拖给聊天 AI，让它直接合并汇总并生成 PDF","让 AI 写一个自动合并脚本，每周定时运行并生成 PDF 发送","让 AI 自动识别 5 份表的对应关系并合并，生成周报后自动发送给所有人"],answer:0,points:[5,1,2,0]},
  {id:7,dim:1,text:"你需要 2 小时内拿到一份 15 页、打开就能讲的季度汇报 PPT。下面哪种最符合「让 AI 直接交付成品」？",options:["让 AI 负责构思大纲和每页标题，你补全内容并按公司模板排版，确保风格统一","让 AI 把每页的文字内容写好，自己复制进 PowerPoint 排版","用 AI Agent 把你的材料直接生成 .pptx 成品，打开即用","用 Gamma 等 AI 演示工具在线生成 PPT，再导出微调公司模板"],answer:2,points:[1,2,5,3]},
  {id:8,dim:1,text:"下面哪个任务用「聊天 AI＋少量人工操作」的组合就能高效完成，没必要上 AI Agent？",options:["每周把 5 份部门 Excel 汇总成一张周报，再转成 PDF 发管理层","把一段中文产品说明翻译成英文并润色，直接发给海外客户","自动读取客户邮件并分类，每天生成一张待办清单","把散落在群里的每日汇报，定时汇总成一张进度总表"],answer:1,points:[1,5,0,0]},
  {id:9,dim:2,text:"你每周用 AI 写周报，但每次都要花 10 分钟重新说明格式和材料。下面哪种做法最能省去这份重复劳动？",options:["把周报的结构、语气和材料要求固化成模板，以后每周只填数据","建一个共享文档记录周报要求，每次复制给 AI 参考","把效果最好的周报存档，下次挑一份让 AI 照着改","在 AI 里设置好你的偏好，之后它会自动按这个风格生成，不用每次重复说明"],answer:0,points:[5,3,2,1]},
  {id:10,dim:2,text:"你的日报自动化流程已稳定运行 3 周，今天数据源换了格式，AI 处理结果开始出错。下面哪种处理最合理？",options:["这套流程太脆弱，先退回人工填报，等以后有更成熟的方案再自动化","换用支持自动识别新格式的 AI 工具，重新搭建这套流程","让 AI 根据新格式自动调整解析规则，继续按原流程输出日报","定位出错环节，更新格式与字段映射，回归验证后再恢复"],answer:3,points:[0,2,1,5]},
  {id:11,dim:2,text:"你想让 AI 自动汇总 8 个部门的经营数据做月度分析，但各部门字段命名不统一（「销售额」vs「销售金额」、日期格式也不同）。下面哪种做法最能让流程稳定可靠？",options:["每次上传前人工把所有表转成同一格式，再让 AI 汇总","先和各部门约定统一的数据字典和模板，字段对齐后再交给 AI","让 AI 先学习识别 8 种不同格式，之后每次自动兼容","相信 AI 能理解字段含义，直接汇总并自己核对异常"],answer:1,points:[2,5,3,1]},

const letters = ["A","B","C","D"];
const STORAGE_KEY = "ai_assessment_data";
const HISTORY_KEY = "ai_assessment_history";

// ===== Storage =====
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function saveProgress(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){}
}

function clearProgress(){
  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){}
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(!raw) return [];
    return JSON.parse(raw);
  }catch(e){ return []; }
}

function saveToHistory(record){
  try{
    const list = loadHistory();
    list.unshift(record);
    if(list.length > 100) list.length = 100;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  }catch(e){}
}

function clearHistory(){
  try{
    localStorage.removeItem(HISTORY_KEY);
  }catch(e){}
}

// ===== Scoring（选项赋分）=====
function calculateScores(answers){
  const dimEarned = [0,0,0,0,0];  // 每维度实得分（每题满分5）
  const dimMax = [0,0,0,0,0];     // 每维度满分
  let correct = 0;
  const earned = [];              // 每题实得分
  questions.forEach((q,i)=>{
    dimMax[q.dim] += 5;
    if(answers[i] === null){ earned.push(0); return; }
    const p = q.points[answers[i]];
    earned.push(p);
    dimEarned[q.dim] += p;
    if(answers[i] === q.answer) correct++;
  });
  const dimScores = dimEarned.map((e,i) => dimMax[i] ? Math.round(e / dimMax[i] * 100) : 0);
  const total = earned.reduce((a,b)=>a+b,0);
  return { dimEarned, dimMax, dimScores, correct, total, earned };
}

function getGrade(total){
  if(total >= 90) return {label:"优秀",tone:"good",advice:"AI 办公基础扎实，可挑战进阶场景。"};
  if(total >= 75) return {label:"良好",tone:"good",advice:"大部分能力在线，个别维度可加强。"};
  if(total >= 60) return {label:"合格",tone:"mid",advice:"掌握基础用法，建议针对薄弱维度专项练习。"};
  return {label:"待加强",tone:"low",advice:"建议先补基础概念，再逐步上手实操。"};
}

// ===== Radar Chart (SVG) =====
function renderRadar(values, weakIdx = -1){
  const n = values.length;
  const cx = 215, cy = 184, maxR = 118;
  const angle = i => -Math.PI/2 + 2*i*Math.PI/n;
  const point = (i, r) => ({x: cx + r*Math.cos(angle(i)), y: cy + r*Math.sin(angle(i))});

  const dataPoints = values.map((v,i) => point(i, maxR * v / 100));
  const dataPoly = dataPoints.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

  const rings = [25,50,75,100].map(pct => {
    const pts = Array.from({length:n}, (_,i) => {
      const pt = point(i, maxR * pct / 100);
      return `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
    }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="${pct===100?'#d6d3d1':'#e7e5e4'}" stroke-width="1"/>`;
  }).join("");

  const axes = Array.from({length:n}, (_,i) => {
    const pt = point(i, maxR);
    return `<line x1="${cx}" y1="${cy}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#e7e5e4" stroke-width="1"/>`;
  }).join("");

  const circles = dataPoints.map((p,i) =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${i===weakIdx ? '#f59e0b' : '#0f766e'}"/>`
  ).join("");

  const labels = dimensions.map((d,i) => {
    const pt = point(i, maxR + 36);
    const cos = Math.cos(angle(i));
    const anchor = Math.abs(cos) < 0.3 ? "middle" : (cos > 0 ? "start" : "end");
    return `<text x="${pt.x.toFixed(1)}" y="${pt.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="13" font-weight="600" fill="#44403c">${d.short}</text>`;
  }).join("");

  // 各维度得分直接标注在雷达图数据点外侧（不再单独展示进度条）
  const scoreLabels = values.map((v,i) => {
    const r = Math.max(maxR * v / 100 + 12, 32);
    const pt = point(i, r);
    const cos = Math.cos(angle(i));
    const anchor = Math.abs(cos) < 0.3 ? "middle" : (cos > 0 ? "start" : "end");
    const color = i === weakIdx ? '#f59e0b' : '#0f766e';
    return `<text x="${pt.x.toFixed(1)}" y="${pt.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="13" font-weight="700" fill="${color}" paint-order="stroke" stroke="#ffffff" stroke-width="4">${v}</text>`;
  }).join("");

  return `<svg viewBox="0 0 430 360" width="100%" role="img" aria-label="五维能力雷达图">
    ${rings}
    ${axes}
    <polygon points="${dataPoly}" fill="#0f766e" fill-opacity="0.28" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
    ${circles}
    ${scoreLabels}
    ${labels}
  </svg>`;
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

// ===== Format date =====
function fmtDate(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ===== Escape HTML =====
function esc(s){
  if(s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===== State =====
let state = {
  screen: "start", // start | quiz | result | history
  current: 0,
  answers: Array(questions.length).fill(null),
  userName: "",
  userDept: "",
  startTime: null,
  resultData: null
};

// ===== Init from saved progress =====
function initFromSaved(){
  const saved = loadProgress();
  if(saved && saved.answers && saved.answers.some(a => a !== null)){
    state.answers = saved.answers;
    state.current = saved.current || 0;
    state.userName = saved.userName || "";
    state.userDept = saved.userDept || "";
    state.startTime = saved.startTime || Date.now();
    // If all answered, go to result
    if(saved.answers.every(a => a !== null)){
      state.screen = "result";
      state.resultData = calculateScores(saved.answers);
    } else {
      state.screen = "quiz";
    }
  }
}

function persist(){
  saveProgress({
    answers: state.answers,
    current: state.current,
    userName: state.userName,
    userDept: state.userDept,
    startTime: state.startTime
  });
}

// ===== Render functions =====
function render(){
  const root = document.getElementById("root");
  if(state.screen === "start"){
    root.innerHTML = renderStart();
    bindStart();
  } else if(state.screen === "quiz"){
    root.innerHTML = renderQuiz();
    bindQuiz();
  } else if(state.screen === "result"){
    root.innerHTML = renderResult();
    bindResult();
  } else if(state.screen === "history"){
    root.innerHTML = renderHistory();
    bindHistory();
  }
}

// ===== Start Screen =====

  const hasHistory = loadHistory().length > 0;
  return `<div class="app" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh">

      <span class="badge">AI 通用能力测评</span>

      <p class="subtitle">20 道题 \u00b7 选项赋分 \u00b7 覆盖 5 个维度 \u00b7 约 5 分钟完成。答完立即生成五维能力雷达图与改进建议。</p>
      <div class="dim-list">
        ${dimensions.map((d,i) => `
          <div class="dim-item">
            <span class="dim-num" style="background:${d.color}">${i+1}</span>
            <div>
              <div class="dim-name">${d.name}</div>
              <div class="dim-desc">${d.desc}</div>

        `).join("")}
      </div>

            <input type="text" id="inp-name" placeholder="你的名字" value="${esc(state.userName)}">
          </div>
          <div class="input-field">
            <label>部门（选填）</label>
            <input type="text" id="inp-dept" placeholder="部门/团队" value="${esc(state.userDept)}">
          </div>
        </div>
      </div>
      <button class="btn-primary" id="btn-start">开始答题</button>
      ${hasHistory ? `<div style="margin-top:16px;text-align:center"><button class="btn-ghost" id="btn-history">查看历史记录</button></div>` : ""}
    </div>
  </div>`;
}

function bindStart(){
  document.getElementById("btn-start").addEventListener("click", () => {
    state.userName = document.getElementById("inp-name").value.trim();
    state.userDept = document.getElementById("inp-dept").value.trim();
    state.screen = "quiz";
    state.current = 0;
    state.answers = Array(questions.length).fill(null);
    state.startTime = Date.now();
    persist();
    render();
  });
  const histBtn = document.getElementById("btn-history");
  if(histBtn){
    histBtn.addEventListener("click", () => {
      state.screen = "history";
      render();
    });
  }
}

// ===== Quiz Screen =====
function renderQuiz(){
  const idx = state.current;
  const q = questions[idx];
  const dim = dimensions[q.dim];
  const selected = state.answers[idx];
  const progress = (idx + 1) / questions.length * 100;
  const isLast = idx === questions.length - 1;
  const answered = selected !== null;

  return `<div class="app" style="display:flex;flex-direction:column;min-height:100vh">
    <div class="quiz-header">
      <div class="quiz-title">AI 通用能力测评</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="autosave"><span class="autosave-dot"></span>自动保存</span>
        <span class="quiz-progress-text">第 ${idx+1} / ${questions.length} 题</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="quiz-card">
      <span class="dim-tag" style="color:${dim.color};background:${dim.color}1a">
        <span>维度 ${q.dim+1}</span><span>\u00b7</span><span>${dim.name}</span>
      </span>
      <h2>${esc(q.text)}</h2>
      <div class="options">
        ${q.options.map((opt,i) => `
          <button class="option-btn ${selected===i?'selected':''}" data-idx="${i}">
            <span class="option-letter">${letters[i]}</span>
            <span style="flex:1">${esc(opt)}</span>
          </button>
        `).join("")}
      </div>
      <div class="quiz-nav">
        <button class="btn-secondary" id="btn-prev" ${idx===0?'disabled':''}>上一题</button>
        <span class="nav-hint">${answered?'已选择':'请选择一个答案'}</span>
        ${isLast
          ? `<button class="btn-primary" style="width:auto;padding:8px 20px;font-size:14px" id="btn-finish" ${!answered?'disabled':''}>查看结果</button>`
          : `<button class="btn-secondary" id="btn-next" ${!answered?'disabled':''} style="background:var(--teal-700);color:#fff;border-color:var(--teal-700)">下一题</button>`
        }
      </div>
    </div>
  </div>`;
}

function bindQuiz(){
  const idx = state.current;
  document.querySelectorAll(".option-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const optIdx = parseInt(btn.dataset.idx);
      state.answers[idx] = optIdx;
      persist();
      render();
    });
  });
  const prevBtn = document.getElementById("btn-prev");
  if(prevBtn){
    prevBtn.addEventListener("click", () => {
      if(state.current > 0){
        state.current--;
        persist();
        render();
      }
    });
  }
  const nextBtn = document.getElementById("btn-next");
  if(nextBtn){
    nextBtn.addEventListener("click", () => {
      if(state.current < questions.length - 1){
        state.current++;
        persist();
        render();
      }
    });
  }
  const finishBtn = document.getElementById("btn-finish");
  if(finishBtn){
    finishBtn.addEventListener("click", async () => {
      const scores = calculateScores(state.answers);
      state.resultData = scores;

      // Save to history
      const record = {
        id: Date.now(),
        timestamp: Date.now(),
        userName: state.userName,
        userDept: state.userDept,
        answers: [...state.answers],
        scores: scores,
        duration: Date.now() - (state.startTime || Date.now())
      };
      saveToHistory(record);

      // Submit to Google Sheets
      finishBtn.textContent = "正在提交...";
      finishBtn.disabled = true;
      await submitToSheet(scores);

      clearProgress();
      state.screen = "result";
      render();
    });
  }
}

        <button class="btn-secondary" id="btn-export-json">导出数据 (JSON)</button>
        <button class="btn-secondary" id="btn-export-csv">导出答题明细 (CSV)</button>
        <button class="btn-secondary" id="btn-resubmit">重新提交数据</button>
        <button class="btn-secondary" id="btn-screenshot">保存截图</button>
      </div>
    </div>
  </div>`;
}

function bindResult(){
  document.getElementById("btn-restart").addEventListener("click", () => {
    state.screen = "start";
    state.current = 0;
    state.answers = Array(questions.length).fill(null);
    state.resultData = null;
    render();
  });
  document.getElementById("btn-back-history").addEventListener("click", () => {
    state.screen = "history";
    render();
  });
  document.getElementById("btn-export-json").addEventListener("click", () => {
    exportJSON();
  });
  document.getElementById("btn-export-csv").addEventListener("click", () => {
    exportCSV();
  });
  document.getElementById("btn-screenshot").addEventListener("click", () => {
    showToast("请使用浏览器 Ctrl+P 打印为 PDF 保存");
  });
  const resubmitBtn = document.getElementById("btn-resubmit");
  if(resubmitBtn){
    resubmitBtn.addEventListener("click", async () => {
      resubmitBtn.textContent = "提交中...";
      resubmitBtn.disabled = true;
      await submitToSheet(state.resultData);
      resubmitBtn.textContent = "重新提交数据";
      resubmitBtn.disabled = false;
    });
  }
}

// ===== History Screen =====
function renderHistory(){
  const list = loadHistory();
  return `<div class="app">
    <div class="history-bar">
      <div class="quiz-title">历史记录</div>
      <div style="display:flex;gap:8px">
        ${list.length > 0 ? `<button class="btn-ghost" id="btn-clear-history">清空全部</button>` : ""}
        <button class="btn-secondary" id="btn-back-start">返回</button>
      </div>
    </div>
    ${list.length === 0
      ? `<div class="empty-state">还没有历史记录，完成一次测评后这里会显示结果。</div>`
      : `<div class="history-list">
          ${list.map(r => {
            const grade = getGrade(r.scores.total);
            const gc = grade.tone === "good" ? "grade-good" : (grade.tone === "mid" ? "grade-mid" : "grade-low");
            return `<div class="history-item" data-id="${r.id}">
              <div class="history-info">
                <div class="history-name">${esc(r.userName || "匿名用户")}${r.userDept ? ' \u00b7 '+esc(r.userDept) : ''}</div>
                <div class="history-meta">${fmtDate(r.timestamp)} \u00b7 得分 ${r.scores.total} 分 \u00b7 答对 ${r.scores.correct}/${questions.length}</div>
              </div>
              <div class="history-score">
                <span class="history-score-num">${r.scores.total}</span>
                <span class="history-score-grade ${gc}">${grade.label}</span>
              </div>
            </div>`;
          }).join("")}
        </div>
      `}
    ${list.length > 0 ? `
      <div class="export-bar">
        <button class="btn-secondary" id="btn-export-all-json">导出全部记录 (JSON)</button>
        <button class="btn-secondary" id="btn-export-all-csv">导出全部明细 (CSV)</button>
      </div>
    ` : ""}
  </div>`;
}

function bindHistory(){
  const backBtn = document.getElementById("btn-back-start");
  if(backBtn){
    backBtn.addEventListener("click", () => {
      state.screen = "start";
      render();
    });
  }
  const clearBtn = document.getElementById("btn-clear-history");
  if(clearBtn){
    clearBtn.addEventListener("click", () => {
      if(confirm("确定要清空所有历史记录吗？此操作不可撤销。")){
        clearHistory();
        showToast("历史记录已清空");
        render();
      }
    });
  }
  const exportAllJson = document.getElementById("btn-export-all-json");
  if(exportAllJson){
    exportAllJson.addEventListener("click", () => {
      const list = loadHistory();
      const data = {
        exportTime: new Date().toISOString(),
        totalRecords: list.length,
        records: list.map(r => ({
          ...r,
          dimensionNames: dimensions.map(d => d.name),
          questionTexts: questions.map(q => q.text)
        }))
      };
      downloadFile(JSON.stringify(data, null, 2), "ai-assessment-history.json", "application/json");
      showToast("已导出 " + list.length + " 条记录");
    });
  }
  const exportAllCsv = document.getElementById("btn-export-all-csv");
  if(exportAllCsv){
    exportAllCsv.addEventListener("click", () => {
      const list = loadHistory();
      let csv = "\uFEFF姓名,部门,时间,总分,等级,答对题数,需求表达,工具选型,流程复用,资料整合,输出核验\n";
      list.forEach(r => {
        const grade = getGrade(r.scores.total);
        const row = [
          r.userName || "",
          r.userDept || "",
          fmtDate(r.timestamp),
          r.scores.total,
          grade.label,
          r.scores.correct + "/" + questions.length,
          ...r.scores.dimScores
        ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
        csv += row + "\n";
      });
      downloadFile(csv, "ai-assessment-history.csv", "text/csv");
      showToast("已导出 CSV");
    });
  }
  // Click history item to view detail
  document.querySelectorAll(".history-item").forEach(item => {
    item.addEventListener("click", () => {
      const id = parseInt(item.dataset.id);
      const list = loadHistory();
      const record = list.find(r => r.id === id);
      if(record){
        state.answers = record.answers;
        state.userName = record.userName || "";
        state.userDept = record.userDept || "";
        state.resultData = calculateScores(record.answers);
        state.screen = "result";
        render();
      }
    });
  });
}

// ===== Export =====
function exportJSON(){
  const sc = state.resultData;
  const data = {
    assessment: "AI通用能力测评（基础版）",
    timestamp: new Date().toISOString(),
    user: { name: state.userName, dept: state.userDept },
    summary: {
      total: sc.total,
      correct: sc.correct,
      totalQuestions: questions.length,
      grade: getGrade(sc.total).label
    },
    dimensions: dimensions.map((d,i) => ({
      name: d.name,
      score: sc.dimScores[i],
      correct: sc.dimCount[i],
      total: sc.dimTotal[i]
    })),
    answers: questions.map((q,i) => ({
      id: q.id,
      dimension: dimensions[q.dim].name,
      question: q.text,
      yourAnswer: state.answers[i] !== null ? `${letters[state.answers[i]]}. ${q.options[state.answers[i]]}` : "未作答",
      yourScore: state.answers[i] !== null ? sc.earned[i] : 0,
      maxScore: 5,
      correctAnswer: `${letters[q.answer]}. ${q.options[q.answer]}`,
      isFullMark: state.answers[i] === q.answer,
      optionScores: q.points.map((p,j) => `${letters[j]}.${p}`).join(" ")
    }))
  };
  downloadFile(JSON.stringify(data, null, 2), "ai-assessment-result.json", "application/json");
  showToast("已导出 JSON");
}

function exportCSV(){
  const sc = state.resultData;
  let csv = "\uFEFF题号,维度,题目,你的答案,得分,满分,满分答案,是否满分\n";
  questions.forEach((q,i) => {
    const yourAns = state.answers[i] !== null ? `${letters[state.answers[i]]}. ${q.options[state.answers[i]]}` : "未作答";
    const score = state.answers[i] !== null ? sc.earned[i] : 0;
    const correctAns = `${letters[q.answer]}. ${q.options[q.answer]}`;
    const isFull = state.answers[i] === q.answer ? "是" : "否";
    const row = [q.id, dimensions[q.dim].name, q.text, yourAns, score, 5, correctAns, isFull]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
    csv += row + "\n";
  });
  csv += `\n,综合得分,${sc.total},答对,${sc.correct}/${questions.length},等级,${getGrade(sc.total).label}\n`;
  csv += `,姓名,${state.userName || ""},部门,${state.userDept || ""},时间,${fmtDate(Date.now())}\n`;
  downloadFile(csv, "ai-assessment-detail.csv", "text/csv");
  showToast("已导出 CSV");
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ===== Submit to Google Sheets =====
async function submitToSheet(scores){
  if(!CONFIG.SHEET_WEB_APP_URL){
    showToast("未配置数据收集地址，数据仅本地保存");
    return {success:false, reason:"not_configured"};
  }
  try{
    const grade = getGrade(scores.total);
    const detail = questions.map((q,i) => {
      const userAns = state.answers[i];
      const score = userAns !== null ? scores.earned[i] : 0;
      return `第${q.id}题[${dimensions[q.dim].short}] 选${userAns!==null?letters[userAns]:"-"}得${score}/5分 (满分:${letters[q.answer]})`;
    }).join(" | ");

    const payload = {
      userName: state.userName || "匿名",
      userDept: state.userDept || "",
      total: scores.total,
      grade: grade.label,
      correct: scores.correct,
      totalQuestions: questions.length,
      dimScores: scores.dimScores,
      dimEarned: scores.dimEarned,
      earnedPoints: scores.earned,
      duration: Math.round((Date.now() - (state.startTime || Date.now())) / 1000),
      detail: detail
    };

    // no-cors 模式：Google Apps Script 会 302 重定向到 googleusercontent.com，
    // 该域名无 CORS 头，cors 模式下浏览器会拦截。改用 no-cors 可正常发送请求，
    // 代价是无法读取响应内容（返回 opaque），但数据已写入 Sheets。
    const resp = await fetch(CONFIG.SHEET_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });

    // no-cors 模式下 resp.type 为 "opaque"，无法读取响应体
    // 请求未抛异常即认为提交成功
    showToast("成绩已提交成功");
    return {success:true};
  }catch(err){
    showToast("网络错误，数据已本地保存");
    return {success:false, reason:"network_error", error:String(err)};
  }
}
