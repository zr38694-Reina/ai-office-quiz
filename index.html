<!DOCTYPE html>

<head>

<title>AI 办公能力测评</title>
<style>

  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  .app{max-width:760px;margin:0 auto;padding:24px 16px 48px;}

/* ---------------- 状态与本地存储 ---------------- */
const LS_PROGRESS = "ai_quiz_progress_v1";
const LS_HISTORY  = "ai_quiz_history_v1";
const LETTERS = ["A", "B", "C", "D"];

let state = {
  screen: "start",                       // start | quiz | result
  current: 0,
  answers: Array(QUESTIONS.length).fill(null),
  respondent: { name: "", department: "" },
  lastResult: null,
  submitNote: "",
};

const app = document.getElementById("app");

function saveProgress() {
  try {
    localStorage.setItem(LS_PROGRESS, JSON.stringify({
      current: state.current, answers: state.answers, respondent: state.respondent,
    }));
  } catch (e) { /* ignore */ }
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(LS_PROGRESS);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.answers) || d.answers.length !== QUESTIONS.length) return null;
    return d;
  } catch (e) { return null; }
}
function clearProgress() {
  try { localStorage.removeItem(LS_PROGRESS); } catch (e) {}
}
function hasStarted() {
  const d = loadProgress();
  return d && d.answers.some(a => a !== null);
}
function pushHistory(result) {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]");
    arr.push(result);
    localStorage.setItem(LS_HISTORY, JSON.stringify(arr.slice(-50)));
  } catch (e) {}
}

/* ---------------- 成绩计算 ---------------- */
function computeResult() {
  const dimStats = DIMS.map((d, di) => {
    let correct = 0, total = 0;
    QUESTIONS.forEach((q, i) => { if (q.dim === di) { total++; if (state.answers[i] === q.answer) correct++; } });
    return { dim: di, name: d.name, correct, total, score: Math.round((correct / total) * 100) };
  });
  const answers = QUESTIONS.map((q, i) => {
    const chosen = state.answers[i];
    return {
      id: q.id, dim: q.dim, text: q.text,
      chosen, chosenText: chosen === null ? null : q.options[chosen],
      correct: q.answer, correctText: q.options[q.answer],
      isCorrect: chosen === q.answer,
    };
  });
  const totalCorrect = answers.filter(a => a.isCorrect).length;
  const totalScore = totalCorrect * 5;
  const weakest = dimStats.reduce((a, b) => (b.score <= a.score ? b : a));
  let grade, gradeClass, gradeAdvice;
  if (totalScore >= 90) { grade = "优秀"; gradeClass = "g-ok"; gradeAdvice = "AI 办公基础扎实，可挑战进阶场景。"; }
  else if (totalScore >= 75) { grade = "良好"; gradeClass = "g-ok"; gradeAdvice = "大部分能力在线，个别维度可加强。"; }
  else if (totalScore >= 60) { grade = "合格"; gradeClass = "g-mid"; gradeAdvice = "掌握基础用法，建议针对薄弱维度专项练习。"; }
  else { grade = "待加强"; gradeClass = "g-low"; gradeAdvice = "建议先补基础概念，再逐步上手实操。"; }
  return {
    site: CONFIG.siteName,
    submittedAt: new Date().toISOString(),
    respondent: state.respondent,
    totalScore, totalCorrect, total: QUESTIONS.length,
    grade, gradeAdvice,
    weakest: weakest.dim,
    dimStats,
    answers,
    answerLetters: answers.map(a => (a.chosen === null ? null : LETTERS[a.chosen])),
  };
}

/* ---------------- 数据上报 ---------------- */
async function submitPayload(payload) {
  if (CONFIG.endpoint) {
    try {
      const opts = { method: "POST", headers: { Accept: "application/json" } };
      if (CONFIG.endpointFormat === "form") {
        opts.headers["Content-Type"] = "application/x-www-form-urlencoded";
        const fd = new URLSearchParams();
        for (const k in payload) fd.append(k, (typeof payload[k] === "string") ? payload[k] : JSON.stringify(payload[k]));
        opts.body = fd.toString();
      } else if (CONFIG.endpointFormat === "text") {
        // 兼容 Google Apps Script 等接口：text/plain 可避免浏览器 CORS 预检
        opts.headers["Content-Type"] = "text/plain;charset=utf-8";
        opts.body = JSON.stringify(payload);
      } else {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(payload);
      }
      const res = await fetch(CONFIG.endpoint, opts);
      if (res.ok || res.status < 400) return { ok: true, via: "endpoint" };
      return { ok: false, via: "endpoint", status: res.status };
    } catch (e) {
      return { ok: false, via: "endpoint", error: String(e && e.message || e) };
    }
  }
  return { ok: false, via: "local" };
}

function downloadJSON(payload, filename) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename || "quiz-result.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ---------------- 雷达图（SVG） ---------------- */
function radarSVG(scores) {
  const cx = 150, cy = 135, R = 98, n = DIMS.length;
  let s = '<svg viewBox="0 0 300 270" width="300" height="270" role="img">';
  for (let lv = 1; lv <= 4; lv++) {
    const r = (R * lv) / 4;
    const pts = DIMS.map((_, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
    s += `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="#e7e5e4" stroke-width="1"/>`;
  }
  DIMS.forEach((d, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e7e5e4" stroke-width="1"/>`;
    const lx = cx + (R + 24) * Math.cos(a), ly = cy + (R + 24) * Math.sin(a);
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#57534e">${d.short}</text>`;
  });
  const pts = DIMS.map((_, i) => {
    const v = Math.max(0, Math.min(1, (scores[i] || 0) / 100));
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)];
  });
  s += `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="rgba(15,118,110,.25)" stroke="#0f766e" stroke-width="2"/>`;
  pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0f766e"/>`; });
  s += "</svg>";
  return s;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------------- 渲染：开始页 ---------------- */
function renderStart(resume) {
  const saved = resume && loadProgress();
  const fields = CONFIG.needRespondent ? `
    <div class="card mt3">
      <div class="field"><label>姓名 / 花名（选填）</label>
        <input id="rp_name" placeholder="选填" value="${esc(saved && saved.respondent ? saved.respondent.name : "")}"></div>
      <div class="field"><label>部门 / 团队（选填）</label>
        <input id="rp_dept" placeholder="选填" value="${esc(saved && saved.respondent ? saved.respondent.department : "")}"></div>
    </div>` : "";
  app.innerHTML = `
    <div class="card center">
      <div class="badge">AI 办公能力测评</div>
      <h1 style="margin-top:14px">测一测你的 AI 办公能力</h1>
      <p class="sub">20 道单选题 · 覆盖 5 个维度 · 约 5 分钟完成<br>答完生成五维能力雷达图与改进建议</p>
      <div class="row">
        <button class="btn btn-primary" id="btn_start">开始测评</button>
        ${resume ? '<button class="btn btn-ghost" id="btn_resume">继续上次答题</button>' : ""}
      </div>
      ${fields}
    </div>
    <p class="foot">${CONFIG.endpoint ? "测评数据将提交给主办方" : "结果将保存在本机浏览器"}</p>`;
  app.querySelector("#btn_start").onclick = () => {
    if (CONFIG.needRespondent) {
      state.respondent.name = (app.querySelector("#rp_name") || {}).value || "";
      state.respondent.department = (app.querySelector("#rp_dept") || {}).value || "";
    }
    state.screen = "quiz";
    state.current = 0;
    state.answers = Array(QUESTIONS.length).fill(null);
    clearProgress();
    renderQuiz();
  };
  const rb = app.querySelector("#btn_resume");
  if (rb) rb.onclick = () => {
    const d = loadProgress();
    if (d) {
      state.answers = d.answers;
      state.respondent = d.respondent || { name: "", department: "" };
      const firstNull = d.answers.findIndex(a => a === null);
      state.current = firstNull === -1 ? QUESTIONS.length - 1 : firstNull;
    }
    state.screen = "quiz";
    renderQuiz();
  };
}

/* ---------------- 渲染：答题页 ---------------- */
function renderQuiz() {
  const q = QUESTIONS[state.current];
  const chosen = state.answers[state.current];
  const pct = ((state.current + 1) / QUESTIONS.length) * 100;
  const dim = DIMS[q.dim];
  const optsHtml = q.options.map((opt, i) => {
    const cls = chosen === i ? "option sel" : "option";
    return `<button class="${cls}" data-i="${i}"><span class="key">${LETTERS[i]}</span><span>${esc(opt)}</span></button>`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="qmeta"><span>第 ${state.current + 1} / ${QUESTIONS.length} 题</span><span class="qdim">${esc(dim.name)}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      ${optsHtml}
      <div class="nav">
        <button class="btn btn-ghost" id="btn_prev" ${state.current === 0 ? "disabled style='opacity:.4'" : ""}>上一题</button>
        ${state.current === QUESTIONS.length - 1
          ? '<button class="btn btn-primary" id="btn_finish">提交并查看结果</button>'
          : '<button class="btn btn-primary" id="btn_next">下一题</button>'}
      </div>
    </div>`;
  app.querySelectorAll(".option").forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.getAttribute("data-i"), 10);
      state.answers[state.current] = i;
      saveProgress();
      renderQuiz();
    };
  });
  const prev = app.querySelector("#btn_prev");
  if (prev) prev.onclick = () => { if (state.current > 0) { state.current--; renderQuiz(); } };
  const next = app.querySelector("#btn_next");
  if (next) next.onclick = () => { if (state.current < QUESTIONS.length - 1) { state.current++; saveProgress(); renderQuiz(); } };
  const fin = app.querySelector("#btn_finish");
  if (fin) fin.onclick = () => { state.screen = "result"; finishQuiz(); };
}

/* ---------------- 完成：计算 + 上报 + 渲染结果 ---------------- */
function finishQuiz() {
  const result = computeResult();
  state.lastResult = result;
  pushHistory(result);
  clearProgress();
  renderResult("submitting");
  submitPayload(result).then(r => {
    if (r.ok) {
      renderResult("ok");
    } else {
      renderResult("local", r);
    }
  });
}

function gradeBadge(g) {
  return `<span class="grade ${g.gradeClass}">${g.grade}</span>`;
}

function renderResult(status, info) {
  const r = state.lastResult;
  if (!r) return;
  const scores = DIMS.map((_, i) => (r.dimStats[i] ? r.dimStats[i].score : 0));
  const dimBars = r.dimStats.map((d, i) => `
    <div class="dimbar">
      <span class="dn">${esc(d.name)}</span>
      <span class="track"><span class="fill" style="width:${d.score}%;background:${["#0f766e", "#2563eb", "#d97706", "#7c3aed", "#be123c"][i]}"></span></span>
      <span class="dv">${d.score}</span>
    </div>`).join("");
  const wrong = r.answers.filter(a => !a.isCorrect);
  let statusHtml;
  if (status === "ok") {
    statusHtml = `<div class="status ok">✔ 答题结果已提交成功。</div>`;
  } else if (status === "submitting") {
    statusHtml = `<div class="status">正在提交答题结果…</div>`;
  } else {
    const why = CONFIG.endpoint ? (info && info.status ? "提交失败" : "网络或接口异常") : "未配置数据收集地址";
    statusHtml = `<div class="status warn">${why}：结果已保存在本机浏览器。${CONFIG.showDownload ? "可点击下方按钮下载保存。" : ""}</div>`;
  }
  const revHtml = wrong.length
    ? wrong.map(a => `
        <div class="rev">
          <div class="rq">第 ${a.id} 题 · ${esc(DIMS[a.dim].name)}<br><span style="font-weight:500;color:#57534e">${esc(a.text)}</span></div>
          <div class="ra">你的答案：${a.chosen === null ? "未作答" : LETTERS[a.chosen] + " · " + esc(a.chosenText)}</div>
          <div class="rc">正确答案：${LETTERS[a.correct]} · ${esc(a.correctText)}</div>
        </div>`).join("")
    : "";
  app.innerHTML = `
    <div class="card center">
      <div class="badge">测评结果</div>
      <div class="score-wrap"><span class="score-num">${r.totalScore}</span><span class="score-total">/ 100</span></div>
      ${gradeBadge(r)}
      <p class="sub" style="margin-top:10px">${esc(r.gradeAdvice)}</p>
      ${statusHtml}
      <div class="row mt3">
        ${CONFIG.showDownload ? '<button class="btn btn-ghost" id="btn_dl">下载结果（JSON）</button>' : ""}
        <button class="btn btn-primary" id="btn_restart">再测一次</button>
      </div>
      ${CONFIG.endpoint ? "" : `<div class="tip">主办方尚未配置数据收集地址，本结果仅保存在当前浏览器。如需集中统计，请在 HTML 顶部 CONFIG.endpoint 填入表单地址。</div>`}
    </div>
    <div class="card mt3">
      <div class="radar">${radarSVG(scores)}</div>
      <h3 style="text-align:center">各维度得分</h3>
      ${dimBars}
    </div>
    ${wrong.length ? `<div class="card mt3"><h2>错题回顾（${wrong.length} 题）</h2>${revHtml}</div>` : `<div class="card mt3 center"><h2>全部答对，太棒了！🎉</h2></div>`}
    <p class="foot">AI 办公能力测评 · 对外版</p>`;
  const dl = app.querySelector("#btn_dl");
  if (dl) dl.onclick = () => downloadJSON(r, "AI办公能力测评-结果.json");
  app.querySelector("#btn_restart").onclick = () => {
    state.answers = Array(QUESTIONS.length).fill(null);
    state.current = 0;
    state.lastResult = null;
    state.screen = "start";
    renderStart(false);
  };
}

/* ---------------- 启动 ---------------- */
function boot() {
  const resume = hasStarted();
  state.screen = "start";
  renderStart(resume);
}
boot();
</script>
</body>
</html>
